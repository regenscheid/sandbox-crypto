# SPDX-License-Identifier: MIT
# A local Sandbox Science on babbage: `uv run sandbox-science up --config examples/sandbox-science.toml`
# (docs/QUICKSTART.md). Relative paths are against this file; ~ is your home directory.

# What the launcher makes: tokens, settings, the worker's state, the control store, logs.
state_dir = "~/.local/state/sandbox-science"

[[projects]]
id = "crypto"
profile = "minimal"
# A session in the project's default environment, and one in an environment of its own.
sessions = ["main", { id = "scratch", dedicated = true }]
# The skill packs of [skills.packs] the project pins, besides the built-in skills.
# skills = ["crypto"]

[model]
# Replace this reserved example endpoint in your private config; do not commit your gateway URL.
url = "https://gateway.example.invalid/v1"
name = "sandbox-orchestrator"
# Reviews and the workspace's math repairs, the job watcher's check-ins on long jobs, and
# delegated runs; one alias may serve the main agent and these. A gateway that serves
# arrcodex-gpt-6-luna may set reviewer to that alias independently after checking its
# consistency findings on representative evidence.
reviewer = "sandbox-orchestrator"
watcher = "sandbox-orchestrator"
delegated = "sandbox-orchestrator"
# The gateway API each alias is called through: "chat" (/chat/completions, every alias's
# by default) or "responses" (/v1/responses, GPT's Responses API with its reasoning sent
# back), or "messages" (/v1/messages, Claude's Messages API with its progress
# notes). Leave it out until the labs confirm the others.
# api = { sandbox-orchestrator = "responses" }
# Uploaded by path into the confined runtime; keep it mode 600.
api_key_file = "~/.config/sandbox-science/secrets/litellm-harness.key"
# Claude's thinking sent back, once the CM-F30 run passes against the deployed gateway
# image (a LiteLLM release with its thinking fixes), which this names; off without it.
# [model.thinking_replay]
# image = "sha256:<the image's digest>"
# version = "<its x-litellm-version>"
# verified = 2026-11-02
# run = "<the CM-F30 run's ID>"

[orchestrator]
# Build with images/build.sh orchestrator. Replace BOTH values with its tag and
# complete source revision; startup checks the image's embedded revision.
image = "sandbox-science/orchestrator:replace-with-built-tag"
revision = "0000000000000000000000000000000000000000"
control_listen = "127.0.0.1:8202"

[run_service]
# Context tokens before the provider's input limit caps them; default 600,000.
# Lower ceilings exercise the same folding path sooner, without changing budgets.
# context_ceiling = 600000
# The model calls a main run makes before it pauses and asks you in the chat to continue
# for another block of as many, or to stop: 2,000 unless set (0 is the default too), at
# most 100,000.
# max_turns = 2000
# The math checks on the documents' formulas, and the figure checks on their charts
# (its figures directory): npm run build:math in web/workspace, and Node 22.12 or newer
# (22.13 or newer for the figure checks, which use Node's permission model).
math_checks = "../web/workspace/dist-math"
node = "node"

[worker]
listen = "127.0.0.1:8100"
pool_id = "babbage"
# The project policy, granted to every project above.
policy = "policy.yaml"
# Optional: the config of a worker-side unit (docs/UNIT.md) started before `up`, which runs this
# worker with the policy middleware and the package cache. `up` then starts no worker of its own.
# unit = "unit.toml"

[workspace]
listen = "127.0.0.1:8200"
# The PDF viewer's origin is the next port, given by the name localhost: another site
# from 127.0.0.1. preview_name = "127.0.0.1" gives it by its address, on the same site.
# preview_listen = "127.0.0.1:8201"
static = "../web/workspace/dist"

# Skill packs (docs/SKILLS.md): uncomment, and name them in a project's skills. up imports
# each once, on this computer with your git, and keeps the projects' pins; up
# --update-skills or sandbox-science skills update fetches them again from their refs and
# says what changed. embedding_model, the gateway's embedding alias if it has one, lets
# runs find skills by meaning as well as words; metadata_model has each import's model pass
# derive the topics, entry skills and short descriptions a pack leaves out.
# [skills]
# embedding_model = "sandbox-embedding"
# metadata_model = "sandbox-orchestrator"
#
# [skills.packs.crypto]
# git = "https://github.com/regenscheid/crypto-analysis-skills"
# ref = "main"

# The worker's [openshell] table (docs/WORKER.md), for the lab .agents/labs/lab_up.sh brings up.
[openshell]
cli = "~/.local/opt/openshell-0.1.5/bin/openshell"
python = "/opt/sandbox-science/bin/python"   # the default: the base images' interpreter
isolation_tier = 3
package_cache = "http://host.openshell.internal:8090"

[openshell.env]
XDG_CONFIG_HOME = "~/.local/state/openshell-lab/config"
XDG_STATE_HOME = "~/.local/state/openshell-lab/state"
XDG_DATA_HOME = "~/.local/state/openshell-lab/data"
OPENSHELL_LOCAL_TLS_DIR = "~/.local/state/openshell-lab/state/openshell/tls"
OPENSHELL_TELEMETRY_ENABLED = "false"

[openshell.environments]
policy_store = "~/.local/state/openshell-lab/middleware/state"
targets = "~/.local/state/openshell-lab/targets.yaml"
ceiling = "~/.local/state/openshell-lab/middleware/pool-ceiling.yaml"
# Idle suspension is off by default: suspending a sandbox loses its kernels' memory, which a
# long investigation may still need. To suspend a project's sandbox after an hour unused
# (its next use starts it again), uncomment this. sandbox-science down, or Ctrl-C to up,
# suspends them all the same way whatever this says (down --keep-sandboxes leaves them running).
# suspend_after = 3600.0

[openshell.environments.profiles]
# The tags images/build.sh printed.
minimal = "sandbox-science/minimal:02f85b3"
crypto-base = "sandbox-science/crypto-base:02f85b3"

# The MCP proxy, in an OpenShell sandbox of its own (docs/QUICKSTART.md): uncomment once
# images/build.sh mcp-proxy has built its image. With provider_env_file, up registers the
# provider from the owner's file when the gateway has none, as on each new lab gateway:
# babbage's default for now (the owner, 2026-10-15). The path below is a placeholder: no
# file in the repository names the real one, which only a config outside it does, as the
# lab's (.agents/labs/README.md). Without provider_env_file, create the provider by hand
# (docs/MCP-CONNECTORS.md). index and [mcp_proxy.about] shape the index of the servers'
# tools the main agent gets (lab 39, B5): the servers behind the portal it lists tool by
# tool, the others by their count, found with a query; and what each server is for, which
# it marks as the operator's. A key is SERVER/BEHIND: the portal, and the server behind it.
# [mcp_proxy]
# image = "sandbox-science/mcp-proxy:d27e41a"
# providers = ["crypto-research-mcp"]
# servers = ["crypto-research-mcp"]
# provider_env_file = "/path/to/the/owners/cloudflare.env"
# provider_profile = "openshell/profiles/cloudflare-access.yaml"
#
# index = ["crypto-research-mcp/attack-catalog-mcp", "crypto-research-mcp/e-print-mcp", "crypto-research-mcp/nist-csrc-mcp", "crypto-research-mcp/paper-search-mcp", "crypto-research-mcp/web-fetch-mcp"]
#
# [mcp_proxy.credentials]
# "crypto-research-mcp.CF_ACCESS_CLIENT_ID" = "CF_ACCESS_CLIENT_ID"
# "crypto-research-mcp.CF_ACCESS_CLIENT_SECRET" = "CF_ACCESS_CLIENT_SECRET"
#
# [mcp_proxy.about]
# "crypto-research-mcp/attack-catalog-mcp" = "a catalog of cryptanalytic attacks: which apply to a scheme, and their sources"
# "crypto-research-mcp/e-print-mcp" = "the IACR Cryptology ePrint Archive: search its papers, records, full text and PDFs"
# "crypto-research-mcp/firecrawl-mcp" = "the open web: search, scrape and crawl pages; for papers, use a paper archive first"
# "crypto-research-mcp/nist-csrc-mcp" = "NIST CSRC publications (FIPS, SP 800, IR): search, read and their PDFs"
# "crypto-research-mcp/paper-search-mcp" = "papers across arXiv, DBLP, Crossref, OpenAlex and Semantic Scholar, with citations"
# "crypto-research-mcp/patent-search-mcp" = "patents: search"
# "crypto-research-mcp/web-fetch-mcp" = "fetch a web page, or its links, as text"
