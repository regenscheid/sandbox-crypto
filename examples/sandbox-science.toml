# SPDX-License-Identifier: MIT
# A local Sandbox Science on babbage: `uv run sandbox-science up --config examples/sandbox-science.toml`
# (docs/QUICKSTART.md). Relative paths are against this file; ~ is your home directory.

# What the launcher makes: tokens, settings, the worker's state, the control store, logs.
state_dir = "~/.local/state/sandbox-science"

[[projects]]
id = "crypto"
profile = "minimal"
# A session in the project's default environment, and one in an environment of its own.
sessions = ["main", { id = "scratch", dedicated = true }]

[model]
url = "https://litellm-api.npages.org/v1"
name = "sandbox-orchestrator"
# Reviews and the workspace's math repairs, and the job watcher's check-ins on long jobs;
# one alias may serve the main agent and these.
reviewer = "sandbox-orchestrator"
watcher = "sandbox-orchestrator"
# Only the run service reads this file; keep it mode 600.
api_key_file = "~/.config/sandbox-science/secrets/litellm-harness.key"

[run_service]
# The math checks on the documents' formulas: npm run build:math in web/workspace, and
# Node 22.12 or newer.
math_checks = "../web/workspace/dist-math"
node = "node"

[worker]
listen = "127.0.0.1:8100"
pool_id = "babbage"
# The project policy, granted to every project above.
policy = "policy.yaml"

[workspace]
listen = "127.0.0.1:8200"
# The PDF viewer's origin: another loopback address makes it another site.
preview_listen = "127.0.0.2:8201"
static = "../web/workspace/dist"

# The worker's [openshell] table (docs/WORKER.md), for the lab .agents/labs/lab_up.sh brings up.
[openshell]
cli = "~/.local/opt/openshell-0.1.3/bin/openshell"
python = "/opt/sandbox-science/bin/python"
isolation_tier = 3
package_cache = "http://host.openshell.internal:8090"

[openshell.env]
XDG_CONFIG_HOME = "~/.local/state/openshell-lab/config"
XDG_STATE_HOME = "~/.local/state/openshell-lab/state"
XDG_DATA_HOME = "~/.local/state/openshell-lab/data"
OPENSHELL_LOCAL_TLS_DIR = "~/.local/state/openshell-lab/state/openshell/tls"
OPENSHELL_TELEMETRY_ENABLED = "false"

[openshell.environments]
policy_store = "~/.local/state/openshell-lab/middleware/state"
targets = "~/.local/state/openshell-lab/targets.yaml"
ceiling = "~/.local/state/openshell-lab/middleware/pool-ceiling.yaml"
# Suspend a project's sandbox after an hour unused, while Sandbox Science runs; its next use
# starts it again. sandbox-science down, or Ctrl-C to up, suspends them all the same way
# (down --keep-sandboxes leaves them running).
suspend_after = 3600.0

[openshell.environments.profiles]
# The tags images/build.sh printed.
minimal = "sandbox-science/minimal:02f85b3"
crypto-base = "sandbox-science/crypto-base:02f85b3"

# The MCP proxy, in an OpenShell sandbox of its own (docs/QUICKSTART.md): uncomment once the
# provider exists (docs/MCP-CONNECTORS.md) and images/build.sh mcp-proxy has built its image.
# [mcp_proxy]
# image = "sandbox-science/mcp-proxy:d27e41a"
# providers = ["crypto-research-mcp"]
# servers = ["crypto-research-mcp"]
#
# [mcp_proxy.credentials]
# "crypto-research-mcp.CF_ACCESS_CLIENT_ID" = "CF_ACCESS_CLIENT_ID"
# "crypto-research-mcp.CF_ACCESS_CLIENT_SECRET" = "CF_ACCESS_CLIENT_SECRET"
