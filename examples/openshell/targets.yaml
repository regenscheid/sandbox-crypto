# Example deployment targets for compiling examples/policy.yaml to OpenShell.
# The MCP proxy retired on 2026-10-26 (D98): an older file's mcp_proxy sections are
# read and ignored.
# scripts/render_openshell_examples.py renders the policies beside this file.
# Hosts are placeholders for platform services (trust zone Z1); they must have
# private addresses, so that no endpoint for a public host reaches them. A
# single-host deployment (the VM driver on babbage) uses host.openshell.internal.

apiVersion: sandbox-science/v0alpha1
kind: OpenShellTargets

sandbox:
  # The policy middleware's registration name in the gateway configuration.
  middleware: sandbox-science-policy
  package_cache: {host: package-cache.sandbox-science.internal, port: 8090}
  # Research code runs arbitrary programs; the middleware decides each request.
  binaries: [/**]
  # Paths the image provides outside the sandbox's workdir, such as a Conda prefix
  # (D48). The compiler adds the devices research code needs; OpenShell adds its
  # baseline system paths. The standard base profile images need (docs/IMAGES.md):
  # filesystem: {read_only: [/var/lib/texmf], read_write: [/opt/sandbox-science]}

orchestrator:
  # The harness's own sandbox (Z2) reaches only these platform services.
  worker_api: {host: worker.sandbox-science.internal, port: 8100}
  model_gateway: {host: litellm.sandbox-science.internal, port: 4000}
  # The interpreter that runs the harness, and the image prefix it lives in (docs/IMAGES.md).
  binaries: [/opt/sandbox-science/bin/python*]
  filesystem: {read_only: [/opt/sandbox-science]}
