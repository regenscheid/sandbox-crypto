# SPDX-License-Identifier: MIT
# Copy outside the checkout. This template deliberately has no runnable image pins.
# Set [images].app and .worker to approved trusted-app/trusted-worker digest URLs.
name = "research-workbench"
namespace = "research"

[images]
# app = "YOUR_REGISTRY/trusted-app@sha256:YOUR_VERIFIED_DIGEST"
# worker = "YOUR_REGISTRY/trusted-worker@sha256:YOUR_VERIFIED_DIGEST"

[models.main]
alias = "research-main"
api = "responses"
effort = "max"

[models.delegated]
alias = "research-delegated"
api = "responses"
effort = "max"

[models.reviewer]
alias = "research-reviewer"
api = "responses"
effort = "medium"

[app]
architecture = "arm64"
storage_gib = 10
# storage_class = "YOUR_BLOCK_STORAGE_CLASS"

[pool]
architecture = "amd64"
storage_gib = 20

# The runtime manager: its own Pod and small PVC. It holds the OpenShell gateway
# profile named here and creates the agent runtime's Kata sandbox on request.
[runtime_manager]
architecture = "arm64"
storage_gib = 1
openshell_gateway = "research-gateway"

# Where OpenShell creates sandboxes (the chart's server.sandboxNamespace). The bundle puts
# one PodDisruptionBudget there so a planned drain waits for running job sandboxes (D93,
# JS-20). Remove this section to render nothing outside `namespace`; set
# job_budget = false when another instance sharing that namespace already renders it.
[sandboxes]
namespace = "research-runtimes"

[secrets.control]
name = "workbench-control"
extra_files = []

[secrets.workspace]
name = "workbench-workspace"

[secrets.worker]
name = "workbench-worker"
extra_files = ["pool-token", "ceiling.yaml", "targets.yaml", "gateway.toml"]

[secrets.middleware]
name = "workbench-middleware"
extra_files = ["ceiling.yaml", "targets.yaml", "gateway-public.pem"]

[secrets.runtime_manager]
name = "workbench-runtime-manager"

# Add [secrets.cache] name = "workbench-cache" and approved network.sandboxes
# peers to enable the optional co-located package cache.

[network.dns]
namespace_labels = { "kubernetes.io/metadata.name" = "kube-system" }
pod_labels = { "k8s-app" = "kube-dns" }

# The runtime reaches control from its sandbox's supervisor Pod; OpenShell fixes those
# labels, so select this gateway's supervisors (KRB-4).
[[network.runtimes]]
namespace_labels = { "kubernetes.io/metadata.name" = "research-runtimes" }
pod_labels = { "openshell.ai/component" = "supervisor", "openshell.ai/gateway-id" = "YOUR_GATEWAY_ID" }

[[network.supervisors]]
namespace_labels = { "kubernetes.io/metadata.name" = "research-runtimes" }
pod_labels = { "app.kubernetes.io/component" = "supervisor" }

# The OpenShell gateway, reachable only from the runtime manager.
[network.gateway]
ports = [8080]
peer.namespace_labels = { "kubernetes.io/metadata.name" = "openshell" }
peer.pod_labels = { "app.kubernetes.io/name" = "openshell" }

# Add explicit [[network.app_egress]] and [[network.pool_egress]] entries for
# approved gateway/S3/package destinations. No external egress is enabled here.
# ports = [443]
# peer.cidr = "192.0.2.10/32"  # documentation-only address; replace privately

[worker]
cpu_request_millis = 500
cpu_limit_millis = 2000
memory_request_mib = 512
memory_limit_mib = 2048
ephemeral_request_mib = 256
ephemeral_limit_mib = 2048
scratch_mib = 512

# Optional, after the operator prepares the OpenShell CLI tree on the pool PVC:
# [worker.environment]
# HOME = "/var/lib/sandbox-science/worker-home"
# XDG_CONFIG_HOME = "/var/lib/sandbox-science/worker-config"
#
# Standard S3 credentials require projected extra_files plus explicit discovery:
# [workspace.environment]
# AWS_SHARED_CREDENTIALS_FILE = "/private/s3-credentials"
# AWS_CONFIG_FILE = "/private/s3-config"
# AWS_PROFILE = "artifact-reader"
# Add s3-credentials/s3-config to secrets.workspace.extra_files first.

# Optional: serve the workspace and its preview origin through the cluster's Traefik,
# over TLS and behind Authentik, instead of `kubectl port-forward`. Off by default.
# Host names here are documentation-only; Authentik, the forward-auth Middleware, DNS and
# the issuer are the operator's (docs/KUBERNETES-PREP.md step 12). The workspace does not
# yet support writes or the PDF viewer behind a TLS proxy (docs/KUBERNETES-BUNDLE.md).
# [workspace]
# allow_remote = true   # required with [ingress], refused without it
#
# [ingress]
# workspace_host = "workspace.example.org"
# preview_host = "preview.example.org"     # a separate origin: a name of its own
# issuer = "YOUR_CLUSTER_ISSUER"           # cert-manager; issuer_kind = "Issuer" for a namespaced one
# authentik_middleware = "authentik-forward-auth"   # a Traefik Middleware in this namespace
# # entry_point = "websecure"
# # ingress_class = "traefik-public"
#
# [[ingress.traefik]]   # the controller's Pods: the only peers let in to ports 8200 and 8201
# namespace_labels = { "kubernetes.io/metadata.name" = "traefik-public" }
# pod_labels = { "app.kubernetes.io/name" = "traefik" }
