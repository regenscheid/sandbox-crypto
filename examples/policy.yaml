# Example project policy (sandbox-science/v0alpha1). The policy library's tests
# load this file, so it stays valid; docs/POLICY.md defines the semantics.
# A deliberately permissive default: reads and package installs flow freely;
# side effects outside the project (writes, pushes, state-changing MCP tools)
# ask first (D95). Cost is not a side effect here: the MCP services limit and bill
# their own use.

apiVersion: sandbox-science/v0alpha1
kind: ProjectPolicy
metadata:
  name: permissive-default
  description: Broad read access, governed side effects

# Applies to anything no rule matches.
defaults:
  action: escalate          # allow | alert | escalate | deny
  log: true

# Permission requests that nobody answers are denied, except under a read-only
# rule, where they proceed as an alert unless the rule sets `on_timeout: deny`
# (D95). Requests to the hosts a provider credential is bound to
# (`credentials.providers[].hosts`) are denied all the same, unless the rule sets
# `allow_credentialed: true`.
escalation:
  timeout: 30m              # per-request wait
  on_timeout: deny          # must be deny policy-wide
  notify: [gui]             # later: push
  hold_scope: operation     # only the affected operation waits

resources:                  # capped by the pool ceiling (docs/POLICY.md)
  cpu: 16
  memory: 64Gi
  pids: 4096
  workspace_disk: 200Gi
  wall_time: 72h
  model_budget_usd_per_day: 50     # enforced by the LiteLLM virtual key

packages:
  conda:
    channels: [conda-forge]
    action: allow
  pypi:
    action: allow
  cargo:
    action: allow
  go:
    action: allow
  npm:
    action: allow
  opam:                     # OCaml: EasyCrypt, Jasmin
    action: allow
  hackage:                  # Haskell: Cryptol, Tamarin
    action: allow
  system_packages: deny     # read-only rootfs; change the base image instead
  # The provisioning tool refuses AGPL-licensed packages unless they are named here,
  # per ecosystem (docs/LICENSING.md); PyPI names in normalized form. For example:
  # agpl_exceptions: {conda: [pymupdf], pypi: [pymupdf]}
  agpl_exceptions: {}
  # Packages come only through the package cache (docs/PACKAGE-CACHE.md); C and
  # C++ libraries and toolchains for every language come from conda-forge.

network:
  rules:
  # Operations are classified first (package | git | mcp | http); a rule only
  # sees operations of its own class. Within a class the most specific rule
  # wins, ties go to the most restrictive action. Wildcards never grant
  # non-public destinations (LAN, .local, ...); name those exactly.
  # Reads are free and recorded, effects are gated (D95): GET and HEAD on any port
  # and git fetch from any public host are allowed; writes and pushes ask first.
    - name: read-only-web
      operation: http
      match: { hosts: ["*"], methods: [GET, HEAD], ports: any }
      action: allow
    # Pre-admitted: a sandbox resolves only the hosts the policy names, and admits
    # others on demand after a refused first connection (docs/POLICY.md,
    # "Admission"). Naming these spares them that delay. Code sources (D97):
    - name: source-hosts
      operation: http
      match:
        hosts:
          - github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
          - gitlab.com
          - gitlab.inria.fr
          - codeberg.org
          - bitbucket.org
          - sourceforge.net
          - downloads.sourceforge.net
          - ftp.gnu.org
          - ftpmirror.gnu.org
          - gmplib.org
          - flintlib.org
          - www.sagemath.org
          - mirrors.mit.edu         # one of Sage's download mirrors
        methods: [GET, HEAD]
        ports: any
      action: allow
    # Research destinations, also pre-admitted:
    - name: research-hosts
      operation: http
      match:
        hosts:
          - eprint.iacr.org
          - www.iacr.org
          - arxiv.org
          - export.arxiv.org
          - zenodo.org
          - huggingface.co
          - cdn-lfs.huggingface.co
          - dblp.org
          - csrc.nist.gov
          - nvlpubs.nist.gov
          - doi.org
          - api.crossref.org
          - api.openalex.org
          - api.semanticscholar.org
        methods: [GET, HEAD]
        ports: any
      action: allow
    # Reviewed read-only POST endpoints, which override the broad write rule below.
    # Crossref, OpenAlex and DBLP search with GET only. No GraphQL endpoint is listed:
    # queries and mutations share one path, which a rule cannot tell apart.
    # Semantic Scholar's batch lookups, which take a list of IDs in the body:
    # https://api.semanticscholar.org/api-docs/graph (POST /paper/batch, /author/batch)
    # and recommendations from positive and negative example papers:
    # https://api.semanticscholar.org/api-docs/recommendations (POST /papers)
    - name: semantic-scholar-reads
      operation: http
      match:
        hosts: [api.semanticscholar.org]
        paths: [/graph/v1/paper/batch, /graph/v1/author/batch, /recommendations/v1/papers]
        methods: [POST]
      action: allow
    # arXiv's query API accepts the same query as GET or POST:
    # https://info.arxiv.org/help/api/user-manual.html ("Calling the API")
    - name: arxiv-query
      operation: http
      match: { hosts: [export.arxiv.org], paths: [/api/query], methods: [POST] }
      action: allow
    - name: external-writes
      operation: http
      match: { hosts: ["*"], methods: [POST, PUT, PATCH, DELETE] }
      action: escalate
    - name: git-fetch
      operation: git
      match: { hosts: ["*"], git_service: upload-pack, ports: any }
      action: allow
    - name: git-push
      operation: git
      match: { hosts: ["*"], git_service: receive-pack }
      action: escalate
    # An escalate rule that holds only reads proceeds as an alert when nobody answers
    # (D95); one that can hold a write, as both above, is denied. A read that must
    # wait for an answer sets `escalation: {on_timeout: deny}`.

# Threshold alerts (`monitors`, such as egress volume) and URL limits
# (`limits.max_url_bytes`) bound exfiltration, which D95 leaves out of scope; both
# remain available (docs/POLICY.md).

mcp:
  # The agent runtime's own client reaches the servers below, through OpenShell's native
  # rules and the policy middleware (D98); research code has no MCP access, and
  # proxy.worker_access and worker_tools, retired with the MCP proxy, are refused.
  proxy:
    max_argument_bytes: 64Ki   # the parameters of one request, which the middleware bounds
  browser_automation: disabled     # browse calls (Firecrawl interact and agent, page actions) are denied (D96)
  # Per-class actions and the widest grant a user may give (D97), for every server
  # unless a server's own `effects` say otherwise. The shipped defaults:
  # effects:
  #   read: {action: allow}
  #   write: {action: escalate, max_grant: project}
  #   communicate: {action: escalate, max_grant: session}
  #   admin: {action: escalate, max_grant: once}
  #   unclassified: {action: escalate, max_grant: once}
  servers:
    crypto-research-mcp:
      url: https://mcp.example.invalid/crypto-research   # placeholder: the Access-protected address
      revision: "2025-11-25"
      auth:                                               # see docs/MCP-CONNECTORS.md
        mode: headers                                     # oauth | bearer | headers | none
        headers:                                          # a Cloudflare Access service token (owner, 2026-10-14)
          CF-Access-Client-Id: "${provider:crypto-research-mcp.CF_ACCESS_CLIENT_ID}"
          CF-Access-Client-Secret: "${provider:crypto-research-mcp.CF_ACCESS_CLIENT_SECRET}"
      # The server lists its tools by their bare names, such as
      # e-print-mcp_search_eprint, with no portal prefix (lab 39, 2026-10-15).
      # Each tool's effect class comes from the checked-in classification
      # (packages/policy/src/sandbox_science/policy/classifications/crypto-research-mcp),
      # with argument rules: firecrawl_scrape is a read, but browse with `actions` and
      # write with `profile.saveChanges: true` (D96). The class decides the call: reads
      # are allowed, writes, messages and admin tools ask, browser automation is off.
      # A tool a new revision adds takes its hints: read if it says readOnlyHint,
      # otherwise unclassified, which asks. Cost is the services' to control, so no
      # tool asks because it is billed.
      classification: crypto-research-mcp
      tools:
        allow:
          - portal_list_servers    # lists the portal's servers; reads nothing else
        deny:
          - "portal_*"             # server configuration is not an agent action

    # Later phase: a server using custom-header authentication.
    # example-header-server:
    #   url: https://mcp.example.invalid/other
    #   revision: "1"
    #   auth:
    #     mode: headers
    #     headers:
    #       X-Api-Key: "${provider:example-header-server.API_KEY}"   # placeholder reference, never a literal secret
    #       X-Account: research
    #   tools: { allow: [search_documents, get_document] }   # exact names; patterns only escalate or deny

credentials:
  # Worker-visible credentials are OpenShell providers (placeholders only). The
  # compiler binds each provider's credential to its `hosts`, on port 443 only;
  # OpenShell substitutes it nowhere else. Its profile must have no endpoints
  # (examples/openshell/profiles/github-token.yaml).
  providers:
    - name: github-readonly
      profile: github-token
      hosts: [api.github.com, github.com]
      scope_note: fine-grained token, contents:read only

shared_data:
  writes: allow_with_conflict_check

data:
  default_class: project-private

# Lockdown modes, set by the admin (D95). The defaults: reads reach any public host,
# and every declared server's tools take their classes.
lockdown:
  network: open-reads      # or allowlist: only `hosts` (names, *.domains, address ranges)
  mcp: declared            # or locked: only tools the policy or its classification names
  # network: allowlist
  # hosts: [eprint.iacr.org, "*.arxiv.org", 192.0.2.0/24]
  # unlisted: deny         # or escalate
