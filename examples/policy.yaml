# Example project policy (sandbox-science/v0alpha1). The policy library's tests
# load this file, so it stays valid; docs/POLICY.md defines the semantics.
# A deliberately permissive default: reads and package installs flow freely;
# side effects outside the project (writes, pushes, paid or state-changing
# MCP tools) ask first.

apiVersion: sandbox-science/v0alpha1
kind: ProjectPolicy
metadata:
  name: permissive-default
  description: Broad read access, governed side effects

# Applies to anything no rule matches.
defaults:
  action: escalate          # allow | alert | escalate | deny
  log: true

# Permission requests that nobody answers are denied. A read-only rule can set
# its own `escalation: {on_timeout: allow}`, which then proceeds as an alert.
escalation:
  timeout: 30m              # per-request wait
  on_timeout: deny          # must be deny policy-wide
  notify: [gui]             # later: push
  hold_scope: operation     # only the affected operation waits

resources:                  # capped by the pool ceiling (docs/POLICY.md)
  cpu: 16
  memory: 64Gi
  pids: 4096
  workspace_disk: 200Gi
  wall_time: 72h
  model_budget_usd_per_day: 50     # enforced by the LiteLLM virtual key

packages:
  conda:
    channels: [conda-forge]
    action: allow
  pypi:
    action: allow
  system_packages: deny     # read-only rootfs; change the base image instead

network:
  rules:
  # Operations are classified first (package | git | mcp | http); a rule only
  # sees operations of its own class. Within a class the most specific rule
  # wins, ties go to the most restrictive action. Wildcards never grant
  # non-public destinations (LAN, .local, ...); name those exactly.
    - name: read-only-web
      operation: http
      match: { hosts: ["*"], methods: [GET, HEAD] }
      limits: { max_url_bytes: 4096 }
      action: allow
    - name: external-writes
      operation: http
      match: { hosts: ["*"], methods: [POST, PUT, PATCH, DELETE] }
      action: escalate
    # Example of a narrower allow overriding the broad write rule:
    # - name: example-post-search-api
    #   operation: http
    #   match: { hosts: [api.example.org], paths: [/v1/search], methods: [POST] }
    #   action: allow
    - name: git-fetch
      operation: git
      match: { hosts: [github.com, gitlab.com, codeberg.org], git_service: upload-pack }
      limits: { max_url_bytes: 4096 }
      action: allow
    - name: git-push
      operation: git
      match: { hosts: ["*"], git_service: receive-pack }
      action: escalate

# Threshold alerts. They add findings and never decide access.
monitors:
  - name: large-egress
    when: { egress_bytes_per_hour_over: 500Mi }
    action: alert

mcp:
  proxy:                    # all MCP traffic goes through the MCP proxy (D67)
    worker_access: true     # worker code may call allowed tools via the proxy
    worker_tools: inherit   # or a narrower allow list for worker code
    max_response_bytes: 2Mi
    binary_results: artifact   # store as artifact references, not inline base64
  servers:
    crypto-research-mcp:
      url: https://mcp.example.invalid/crypto-research   # placeholder; canonical URI = OAuth resource
      revision: "2025-11-25"
      auth:                                               # see docs/MCP-CONNECTORS.md
        mode: oauth                                       # oauth | bearer | headers | none
        registration: dcr                                 # confirmed: crypto-research-mcp supports DCR
        scopes: []                                        # empty = use WWW-Authenticate / scopes_supported
        refresh: gateway                                  # gateway | external
        provider: crypto-research-mcp                     # OpenShell provider holding the tokens
      # The portal prefixes every tool name; patterns match the rest, so a pattern
      # cannot match the prefix ("research" contains "search").
      tool_prefix: crypto_research_mcp-
      # Checked against the server's 78 tools (2026-10-10); the test fixture
      # packages/policy/tests/fixtures/crypto-research-mcp-tools.json pins the
      # expected outcome of every tool, and an unknown tool asks first. An exact
      # name beats patterns; otherwise the most restrictive matching list wins.
      # Patterns are anchored at "_" so subserver names such as paper-search-mcp
      # do not match them.
      tools:
        allow:
          - "*_search"                      # includes per-call billed searches (Scholar, patents, Firecrawl)
          - "*_search_*"
          - "*_get_*"
          - "*_list_*"
          - "*_find_*"
          - "*_fetch"
          - "*_fetch_*"
          - "*_read"
          - "*_read_*"
          - "*_browse_*"
          - "*_recent_*"
          - "*_stats"
          - "*_status"
          - "*_health"
          - paper-search-mcp_paper_citations
          - paper-search-mcp_paper_details
          - firecrawl-mcp_firecrawl_research_inspect_paper
          - firecrawl-mcp_firecrawl_research_related_papers
          - firecrawl-mcp_firecrawl_map
          - firecrawl-mcp_firecrawl_monitor_get
          - firecrawl-mcp_firecrawl_monitor_list
          - firecrawl-mcp_firecrawl_monitor_check
          - firecrawl-mcp_firecrawl_monitor_checks
          - nist-mcp_csrc_currency
          - web-fetch-mcp_web_capture
          - portal_list_servers
          # Reads that fill the server's own document cache on first use:
          - e-print-mcp_eprint_file
          - e-print-mcp_eprint_fulltext
          - nist-mcp_csrc_file
          - nist-mcp_csrc_fulltext
        escalate:
          - "*_feedback"                    # outranks "*_search_*" for firecrawl_search_feedback
          - "*_refresh_*"
          - firecrawl-mcp_firecrawl_agent
          - firecrawl-mcp_firecrawl_crawl
          - firecrawl-mcp_firecrawl_extract
          - firecrawl-mcp_firecrawl_interact
          - firecrawl-mcp_firecrawl_interact_stop
          - firecrawl-mcp_firecrawl_parse
          - firecrawl-mcp_firecrawl_scrape
          - firecrawl-mcp_firecrawl_monitor_create
          - firecrawl-mcp_firecrawl_monitor_update
          - firecrawl-mcp_firecrawl_monitor_run
        deny:
          - "portal_*"             # server configuration is not an agent action

    # Later phase: a server using custom-header authentication.
    # example-header-server:
    #   url: https://mcp.example.invalid/other
    #   revision: "1"
    #   auth:
    #     mode: headers
    #     headers:
    #       X-Api-Key: "${provider:example-header-server.API_KEY}"   # placeholder reference, never a literal secret
    #       X-Account: research
    #   tools: { allow: ["*search*"], escalate: [], deny: [] }

credentials:
  # Worker-visible credentials are OpenShell providers (placeholders only).
  providers:
    - name: github-readonly
      profile: github
      scope_note: fine-grained token, contents:read only

shared_data:
  writes: allow_with_conflict_check

data:
  default_class: project-private
