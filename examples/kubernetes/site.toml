# SPDX-License-Identifier: MIT
# The private site file for `sandbox-science-kubernetes site` (docs/KUBERNETES-BUNDLE.md#generate-the-secrets).
# Copy it outside the checkout, beside the private bundle TOML. It holds no secret value:
# only paths, relative to this file. Replace every YOUR_* placeholder; the names below are
# illustrative. The bundle's name, namespace, Secrets and main/delegated/reviewer models
# come from the bundle TOML it names.
bundle = "private-kubernetes.toml"
worker_policy = "policy.yaml"          # the project policy granted to every project
targets = "targets.yaml"               # OpenShell targets; sandbox.middleware = openshell.registration
ceiling = "pool-ceiling.yaml"          # the pool ceiling for the worker and the middleware
# pool_id = "research-workbench"       # default: the bundle's name
# The cluster's DNS domain: CoreDNS's `kubernetes <domain>` line
# (kubectl -n kube-system get configmap coredns -o yaml). A sandbox resolves only fully
# qualified names (OpenShell's sandbox DNS ignores search domains), so the package cache
# is <name>-cache.<namespace>.svc.<cluster_domain> to sandboxes and in the targets file,
# and the agent runtime (itself in a sandbox) reaches control by its qualified name.
cluster_domain = "cluster.local"

[[projects]]
id = "crypto"
profile = "crypto-base"
sessions = ["main"]

# [skills]
# embedding_model = "YOUR_EMBEDDING_ALIAS"
# metadata_model = "YOUR_MODEL_ALIAS"

# The model gateway. https, or http to an in-cluster Service (*.svc, *.svc.<cluster_domain>),
# whose key then crosses the Pod network unencrypted. The agent runtime reaches it from its
# sandbox, so an in-cluster name must be fully qualified (*.svc alone is refused). The main, delegated and reviewer aliases, APIs
# and efforts are the bundle's [models]; add only the other roles here.
[model]
url = "http://litellm.litellm.svc.cluster.local:4000/v1"
api_key_file = "secure/model.key"      # the runtime manager's key, mode 600
watcher = "research-watcher"
api = { "research-watcher" = "responses" }
reasoning_effort = { watcher = "low" }

# The agent runtime: the orchestrator image by digest, its full 40-hex source revision,
# and its Kata placement. kubernetes.io/arch = amd64 is always added.
[runtime]
image = "YOUR_REGISTRY/orchestrator@sha256:YOUR_VERIFIED_DIGEST"
revision = "YOUR_FULL_40_HEX_SOURCE_REVISION"
runtime_class_name = "kata"
node_selector = { "example.org/kata-capable" = "true" }
requests = { cpu_millicores = 1000, memory_mib = 2048, ephemeral_storage_mib = 1024 }
limits = { cpu_millicores = 2000, memory_mib = 4096, ephemeral_storage_mib = 2048 }

# The worker's options. label_environments gives each sandbox the label
# sandbox-science.io/environment=<ID> on the OpenShell sandbox (not on the Kubernetes
# Sandbox object or Pod); confirmed on an OpenShell 0.1.5 gateway.
# [worker]
# label_environments = false

# Research base profiles: image by digest and Kata placement (examples/kubernetes/worker-placement.toml).
[profiles.minimal]
image = "YOUR_REGISTRY/minimal@sha256:YOUR_VERIFIED_DIGEST"
node_selector = { "example.org/kata-capable" = "true" }
requests = { cpu_millicores = 1000, memory_mib = 512, ephemeral_storage_mib = 256 }
limits = { cpu_millicores = 2000, memory_mib = 2048, ephemeral_storage_mib = 1024 }

[profiles.crypto-base]
image = "YOUR_REGISTRY/crypto-base@sha256:YOUR_VERIFIED_DIGEST"
node_selector = { "example.org/kata-capable" = "true", "example.org/compute-tier" = "high" }
requests = { cpu_millicores = 2000, memory_mib = 4096, ephemeral_storage_mib = 1024 }
limits = { cpu_millicores = 8000, memory_mib = 16384, ephemeral_storage_mib = 4096 }

# The OpenShell gateway. Both identities are issued by the gateway's cert-manager CA
# (docs/KUBERNETES-PREP.md step 5.1); the tool checks each certificate against its ca.crt.
# The endpoint is used by trusted Pods only (the manager and the worker), whose search
# domains complete `.svc`; the chart's server certificate covers openshell.openshell.svc,
# so this form works whatever the cluster's domain.
[openshell]
endpoint = "https://openshell.openshell.svc:8080"
gateway_id = "openshell"                  # the chart's default
# registration = "sandbox-science-policy" # the middleware's registration name
jwt_public_key = "secure/gateway-jwt-public.pem"   # from OpenShell's own Secrets
# admin_hosts = []                        # besides the gateway's host

[openshell.manager]
ca = "secure/manager/ca.crt"
certificate = "secure/manager/tls.crt"
key = "secure/manager/tls.key"

[openshell.worker]
ca = "secure/worker/ca.crt"
certificate = "secure/worker/tls.crt"
key = "secure/worker/tls.key"

# Exactly when the bundle has [secrets.cache]: the package cache's settings besides its
# listener, URL and directory (docs/PACKAGE-CACHE.md). Enable at least one ecosystem
# (pypi, conda, cargo, go, npm, opam, hackage); an empty table takes its defaults.
# [cache]
# max_size = "50Gi"
# pypi = {}
# conda = {}

# Files for the bundle's other extra_files, by service, such as S3 credentials:
# [extra_files.control]
# s3-credentials = "secure/control-s3-credentials"
# s3-config = "secure/control-s3-config"

# With the bundle's HS256 [ingress.forward_auth] (D104): the Authentik proxy provider's client
# secret, mode 600, written once from `ak shell` without printing it
# (docs/KUBERNETES-BUNDLE.md#login-through-authentik-opt-in). It goes into the workspace's
# Secret only.
# forward_auth_secret = "secure/authentik-forward-auth-client-secret"

# With the bundle's [checkpoint]: the SDK credential and config files of the checkpoint keys
# (docs/KUBERNETES-PREP.md, step 6). upload_* goes into the Jobs' Secret in the sandbox
# namespace, verify_* into the worker's Secret; the keeper key never enters the cluster.
# [checkpoint]
# upload_credentials = "secure/checkpoint-upload-credentials"
# upload_config = "secure/checkpoint-upload-config"
# verify_credentials = "secure/checkpoint-verify-credentials"
# verify_config = "secure/checkpoint-verify-config"
# # keeper_endpoint = "http://127.0.0.1:3900"   # through kubectl port-forward, by default
