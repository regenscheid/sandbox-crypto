# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-orchestrator"
version = "0.1.0"
description = "The Sandbox Science orchestrator and research harness"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
dependencies = [
    "sandbox-science-contracts",
    "sandbox-science-policy",
    "aiohttp>=3.10",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "pyyaml>=6.0",
]

[project.scripts]
sandbox-science-harness = "sandbox_science.orchestrator.cli:main"
sandbox-science-control = "sandbox_science.orchestrator.confinement.server:main"
sandbox-science-agent-runtime = "sandbox_science.orchestrator.confinement.runtime:main"
sandbox-science-artifacts = "sandbox_science.orchestrator.cli_artifacts:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.36,<2",
]

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }
sandbox-science-policy = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]

[tool.hatch.build.targets.wheel.force-include]
# The built-in skills, which an installed harness reads as package data (skills/builtin.py).
"../../skills/builtin" = "sandbox_science/orchestrator/skills/builtin_pack"
