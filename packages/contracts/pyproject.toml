# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-contracts"
version = "0.1.0"
description = "Shared contracts (execution context, events, artifacts, worker API) for Sandbox Science"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
