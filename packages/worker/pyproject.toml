# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-worker"
version = "0.1.0"
description = "Trusted worker service and in-sandbox executor for Sandbox Science"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sandbox-science-contracts",
    "sandbox-science-event-store",
    "sandbox-science-policy",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
s3 = ["boto3>=1.36,<2"]
# The executor runs kernels with these inside the sandbox; the local backend
# needs them beside the worker service.
kernels = [
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
]
# PDF parsing runs inside the sandbox (pdfhelper.py); the tests need it beside them.
pdf = [
    "pdf_oxide>=0.3.78",
]

[project.scripts]
sandbox-science-worker = "sandbox_science.worker.cli:main"

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }
sandbox-science-event-store = { workspace = true }
sandbox-science-policy = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
