# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-launcher"
version = "0.1.0"
description = "Starts, supervises and stops a local Sandbox Science from one config file"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
