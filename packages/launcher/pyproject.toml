# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-launcher"
version = "0.1.0"
description = "Starts, supervises and stops a local Sandbox Science from one config file"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sandbox-science-contracts",
    "pydantic>=2.9",
]

[project.scripts]
sandbox-science = "sandbox_science.launcher.cli:main"

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
