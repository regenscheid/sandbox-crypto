# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-testing"
version = "0.1.0"
description = "Test support for Sandbox Science's own tests (a fake clock, waiting helpers); development only"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sandbox-science-contracts",
]

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
