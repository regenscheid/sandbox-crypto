# The classification of crypto-research-mcp's firecrawl-mcp tools (D96, docs/MCP-CONNECTORS.md).
# Reviewed by the admin; sha256 pins each tool as the pinned listing has it
# (packages/policy/tests/fixtures/mcp-tools/crypto-research-mcp/firecrawl-mcp.json).
apiVersion: sandbox-science/v0alpha1
kind: ToolClassification
server: crypto-research-mcp
prefix: firecrawl-mcp_
pinned: "2026-10-26"
tools:
