# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-package-cache"
version = "0.1.0"
description = "Pull-through package cache for Sandbox Science research sandboxes"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sandbox-science-contracts",
    "sandbox-science-policy",
    "aiohttp>=3.10",
]

[project.scripts]
sandbox-science-package-cache = "sandbox_science.package_cache.cli:main"

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }
sandbox-science-policy = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
