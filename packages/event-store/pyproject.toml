# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science-event-store"
version = "0.1.0"
description = "Append-only event store with a hash chain, for Sandbox Science monitor evidence"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
sandbox-science-events = "sandbox_science.event_store.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_science"]
