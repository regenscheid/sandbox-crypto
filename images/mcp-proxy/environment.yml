# SPDX-License-Identifier: MIT
# The mcp-proxy profile's Conda environment, installed at /opt/sandbox-science (docs/IMAGES.md):
# Python and the MCP proxy's third-party dependencies, in the minor versions uv.lock pins. The
# proxy and the workspace packages it imports (contracts, policy, event store) are installed from
# wheels that build.sh builds from this checkout. Permissive packages only, as for minimal: the
# build fails on any other license outside the base distribution's runtime libraries
# (images/common/image_report.py). Lock with images/lock.sh; the build installs conda-lock.yml.
name: mcp-proxy
channels:
  - conda-forge
  - nodefaults
platforms:
  - linux-64
  - linux-aarch64
dependencies:
  - python 3.14.*
  - aiohttp 3.14.*
  - pydantic 2.14.*
  - pyyaml 6.0.*
  - pip
