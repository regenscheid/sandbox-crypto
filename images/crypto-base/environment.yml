# SPDX-License-Identifier: MIT
# The crypto-base profile's Conda environment, installed at /opt/sandbox-science (D46,
# docs/IMAGES.md). It contains GPL tools, so the image is never published; this recipe is MIT.
# Lock with images/lock.sh; the build installs conda-lock.yml.
name: crypto-base
channels:
  - conda-forge
  - nodefaults
platforms:
  - linux-64
  - linux-aarch64
dependencies:
  - python 3.14.*
  # At the `sage` metapackage's constraints (see below).
  - ipykernel >=7.2.0,<8
  - jupyter_client >=8.8.0,<9
  - pip
  # SageMath with its sagemath kernelspec, and the libraries named in D46. Not the `sage`
  # metapackage, which adds only these and Jmol, a Java viewer for 3D plots that brings a
  # Java runtime (400 MB): its other dependencies are listed instead, at its constraints, and
  # Sage shows 3D plots with three.js (threejs-sage, sagelib's). A runtime install of `sage`
  # or `jmol` would bring Java back (docs/IMAGES.md).
  - sagelib 10.9.*
  - blas-devel
  - conway-polynomials >=0.10
  - cvxopt >=1.3.3,<2
  - cypari2 >=2.2.4,<3
  - flintqs >=1.0,<2
  - gap-defaults >=4.15.1
  - gfan >=0.6.2
  - ipywidgets >=8.1.8,<9
  - matplotlib-base >=3.10.8,<4
  - maxima >=5.46.0,<6
  - mpmath >=1.4.1,<1.5
  - nbclient >=0.10.4,<0.11
  - nbconvert >=7.17.0,<8
  - nbformat >=5.10.4,<6
  - networkx >=3.6.1,<4
  - notebook >=7.5.5,<8
  - palp >=2.21,<3
  - pillow >=12.1.1,<13
  - pkg-config
  - pkgconfig
  - pythran >=0.18.1,<0.19
  - pytz >=2026.1
  - rpy2 >=3.6.7,<4
  - rubiks >=20070912
  - sagemath-db-combinatorial-designs >=20140630
  - sagemath-db-elliptic-curves >=0.8.1
  - sagemath-db-graphs >=20210214
  - sagemath-db-polytopes >=20170220
  - sagetex >=3.6.1,<4
  - scipy >=1.17.1,<2
  - sphinx >=9.1.0,<10
  - sqlite >=3.36,<4
  - sympow >=2.23.6,<3
  - sympy >=1.14.0,<2
  - tachyon >=0.99b6,<1
  - widgetsnbextension >=4.0.15,<5
  - zn_poly
  - fpylll
  - fplll
  - pari
  # PARI's elliptic curve data (Cremona's tables), which ellinit("11a1") reads; a base
  # program does not see data installed at runtime (docs/IMAGES.md).
  - pari-elldata
  - libflint
  # G6K has no conda-forge package; the image builds it from source with these. They stay
  # in the image, since research code builds C and C++ too.
  - cython >=3.0
  - setuptools
  - c-compiler
  - cxx-compiler
  - make
  - autoconf
  - automake
  - libtool
