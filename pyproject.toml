# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science"
version = "0.0.0"
description = "Workspace root for the Sandbox Science research workbench"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["sandbox-science-policy"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sandbox-science-policy = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PIE", "RET", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["sandbox_science"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101"]

[tool.pyright]
include = ["packages", "scripts"]
typeCheckingMode = "standard"
strict = ["packages/*/src"]
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib -ra"
markers = [
    "integration: needs OpenShell, KVM or a cluster; runs only when SS_INTEGRATION=1",
]
