# SPDX-License-Identifier: MIT
[project]
name = "sandbox-science"
version = "0.0.0"
description = "Workspace root for the Sandbox Science research workbench"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sandbox-science-contracts",
    "sandbox-science-event-store",
    "sandbox-science-mcp-proxy",
    "sandbox-science-orchestrator",
    "sandbox-science-package-cache",
    "sandbox-science-policy",
    "sandbox-science-policy-middleware",
    "sandbox-science-worker[kernels,pdf]",
    "sandbox-science-workspace",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-aiohttp>=1.0",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "grpcio-tools>=1.66",
    "types-grpcio>=1.0",
    "types-protobuf>=6.30",
    "types-pyyaml>=6.0",
    "pytest-asyncio>=1.4",
    "pytest-timeout>=2.4",
    "pytest-repeat>=0.9",
    "pytest-xdist>=3.6",
    "sandbox-science-testing",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sandbox-science-contracts = { workspace = true }
sandbox-science-event-store = { workspace = true }
sandbox-science-mcp-proxy = { workspace = true }
sandbox-science-orchestrator = { workspace = true }
sandbox-science-policy = { workspace = true }
sandbox-science-policy-middleware = { workspace = true }
sandbox-science-package-cache = { workspace = true }
sandbox-science-worker = { workspace = true }
sandbox-science-testing = { workspace = true }
sandbox-science-workspace = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated protobuf code (scripts/generate_protos.py).
extend-exclude = ["packages/policy-middleware/src/sandbox_science/policy_middleware/_proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C4", "PIE", "RET", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["sandbox_science"]

[tool.ruff.lint.per-file-ignores]
# Tests run subprocesses, build SQL and use synthetic secrets and temporary paths on purpose.
"packages/*/tests/**" = ["S101", "S105", "S106", "S108", "S310", "S603", "S607", "S608"]
"images/tests/**" = ["S101", "S105", "S106", "S108", "S310", "S603", "S607", "S608"]
# Lab scripts send shell and Python sources to sandboxes in strings, kept as written.
".agents/labs/**" = ["E501"]

[tool.pyright]
include = ["packages", "scripts", "images"]
exclude = ["**/_proto", "**/__pycache__"]
typeCheckingMode = "standard"
strict = ["packages/*/src"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["packages", "images"]
addopts = "--import-mode=importlib -ra"
# pytest-asyncio runs every async test and fixture; pytest-aiohttp recommends this mode.
asyncio_mode = "auto"
# A hung test fails after five minutes instead of stalling the run (--timeout=0 turns this off).
timeout = 300
markers = [
    "integration: needs OpenShell, KVM or a cluster; runs only when SS_INTEGRATION=1",
    "images: needs Docker and built base images; runs only when SS_IMAGE_TESTS names them",
]
