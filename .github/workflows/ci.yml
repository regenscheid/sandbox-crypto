# SPDX-License-Identifier: MIT
name: ci

# Pull requests run the static checks, the fast and slow test tiers on Python 3.13, and the
# web app. Pushes to main also run the whole suite serially on every supported Python; the
# nightly run does that too, and repeats the slow tier to measure flakiness.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels that branch's older runs; every commit on main runs in full.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/generate_protos.py --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/check_licenses.py
      # Every collected test is in exactly one tier, so none is left out of pull requests.
      - run: uv run python scripts/tiers.py check

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            tier: fast
            deadline: 1080
            workers: auto
            distribution: load
            selection: ""
            test_timeout: 120
            stack_dump: 100
          - name: slow
            tier: slow
            deadline: 1080
            workers: auto
            distribution: load
            selection: >-
              --ignore=packages/orchestrator/tests/test_skills_staging.py
              --ignore=packages/worker/tests/test_skill_staging.py
            test_timeout: 300
            stack_dump: 280
          - name: staging-orchestrator
            tier: slow
            deadline: 600
            workers: 1
            distribution: load
            selection: packages/orchestrator/tests/test_skills_staging.py
            test_timeout: 300
            stack_dump: 280
          - name: staging-worker
            tier: slow
            deadline: 600
            workers: 1
            distribution: load
            selection: packages/worker/tests/test_skill_staging.py
            test_timeout: 300
            stack_dump: 280
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # A test that runs too long has every thread's stack printed (faulthandler), then its
      # worker is ended (pytest-timeout's thread method, which works wherever the test is
      # stuck); xdist names the test. The run stops at 18 minutes, before the job's limit,
      # so its output is printed either way.
      - run: >-
          scripts/ci_pytest.sh ${{ matrix.deadline }} ${{ matrix.tier }} -n ${{ matrix.workers }}
          --dist=${{ matrix.distribution }} --durations=25
          --timeout=${{ matrix.test_timeout }} --timeout-method=thread
          -o faulthandler_timeout=${{ matrix.stack_dump }} ${{ matrix.selection }}

  # The suite runs serially on every supported Python. Process-heavy staging modules
  # remain in their isolated jobs below so executor contention cannot stall this runner.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv run pytest --durations=50 --session-timeout=2640
          --ignore=packages/orchestrator/tests/test_skills_staging.py
          --ignore=packages/worker/tests/test_skill_staging.py
      - run: uv run python scripts/check_licenses.py

  full-staging:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        stage:
          - name: orchestrator
            selection: packages/orchestrator/tests/test_skills_staging.py
          - name: worker
            selection: packages/worker/tests/test_skill_staging.py
    name: full staging (${{ matrix.python }}, ${{ matrix.stage.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          scripts/ci_pytest.sh 1200 slow -n 1 --dist=load --durations=25
          --timeout=300 --timeout-method=thread -o faulthandler_timeout=280
          ${{ matrix.stage.selection }}

  # Nightly: the slow tier ten times, to measure how often its tests flake. One job running
  # all ten repetitions on the two-CPU runner needed about 78 minutes (9038 of 9750 runs in
  # 72, then the session deadline), so the repetitions are five jobs of two. Each job's
  # summary gives the flake rate it observed; add the five for the night's rate.
  repeat:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: repeat (${{ matrix.shard }}/5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          scripts/ci_pytest.sh 2400 slow -n auto --count 2
          -o tmp_path_retention_policy=failed --timeout=300 --timeout-method=thread
          -o faulthandler_timeout=280
          --ignore=packages/orchestrator/tests/test_skills_staging.py
          --ignore=packages/worker/tests/test_skill_staging.py
      - if: always()
        run: >-
          python3 scripts/flake_report.py "${RUNNER_TEMP}/pytest.txt"
          --title "Slow tier, shard ${{ matrix.shard }}/5 (2 repetitions)"

  # The isolated staging modules, five repetitions in each of two jobs. One module takes
  # about three minutes a repetition on the runner.
  repeat-staging:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2]
        stage:
          - name: orchestrator
            selection: packages/orchestrator/tests/test_skills_staging.py
          - name: worker
            selection: packages/worker/tests/test_skill_staging.py
    name: repeat staging (${{ matrix.python }}, ${{ matrix.stage.name }}, ${{ matrix.shard }}/2)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          scripts/ci_pytest.sh 1800 slow -n 1 --dist=load --count 5
          --timeout=300 --timeout-method=thread -o faulthandler_timeout=280
          ${{ matrix.stage.selection }}
      - if: always()
        run: >-
          python3 scripts/flake_report.py "${RUNNER_TEMP}/pytest.txt"
          --title "Staging, ${{ matrix.stage.name }}, Python ${{ matrix.python }}, shard ${{ matrix.shard }}/2 (5 repetitions)"

  # The workspace GUI (D80): packages from the lockfile, without install scripts.
  web:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/workspace/package-lock.json
      # The lockfile's licenses and sources are checked before any package is installed,
      # and the installed packages' own licenses after.
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json
      - run: npm ci --ignore-scripts
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json --installed
      # Whole-document parser parity exercises the actual locked server parser.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: .
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:math
      # The skill's charts pass the figure check at the pinned versions (FG-31).
      - run: uv run pytest -q packages/orchestrator/tests/test_mathcheck.py packages/orchestrator/tests/test_figurecheck.py
        working-directory: .
        env:
          SS_REQUIRE_FIGURE_CHECK: "1"
