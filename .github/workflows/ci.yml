# SPDX-License-Identifier: MIT
name: ci

# Pull requests run the static checks, the fast and slow test tiers on Python 3.13, and the
# web app. Pushes to main also run the whole suite serially on every supported Python; the
# nightly run does that too, and repeats the slow tier to measure flakiness.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels that branch's older runs; every commit on main runs in full.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_repo_hygiene.py
      - run: uv run python scripts/generate_protos.py --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/check_licenses.py
      # Every collected test is in exactly one tier, so none is left out of pull requests.
      - run: uv run python scripts/tiers.py check

  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: fast
            deadline: 1080
            distribution: load
            test_timeout: 120
            stack_dump: 100
          - tier: slow
            deadline: 1080
            distribution: loadscope
            test_timeout: 300
            stack_dump: 280
    name: test (${{ matrix.tier }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      # A test that runs too long has every thread's stack printed (faulthandler), then its
      # worker is ended (pytest-timeout's thread method, which works wherever the test is
      # stuck); xdist names the test. The run stops at 18 minutes, before the job's limit,
      # so its output is printed either way.
      - run: >-
          scripts/ci_pytest.sh ${{ matrix.deadline }} ${{ matrix.tier }} -n auto
          --dist=${{ matrix.distribution }} --durations=25
          --timeout=${{ matrix.test_timeout }} --timeout-method=thread
          -o faulthandler_timeout=${{ matrix.stack_dump }}

  # The whole suite, serially and unfiltered, on every supported Python.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --durations=50
      - run: uv run python scripts/check_licenses.py

  # Nightly: the slow tier ten times, in parallel, to measure how often its tests flake.
  repeat:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          scripts/ci_pytest.sh 4800 slow -n auto --count 10
          -o tmp_path_retention_policy=failed --timeout=300 --timeout-method=thread
          -o faulthandler_timeout=280

  # The workspace GUI (D80): packages from the lockfile, without install scripts.
  web:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: web/workspace/package-lock.json
      # The lockfile's licenses and sources are checked before any package is installed,
      # and the installed packages' own licenses after.
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json
      - run: npm ci --ignore-scripts
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json --installed
      # Whole-document parser parity exercises the actual locked server parser.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: .
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:math
      # The skill's charts pass the figure check at the pinned versions (FG-31).
      - run: uv run pytest -q packages/orchestrator/tests/test_mathcheck.py packages/orchestrator/tests/test_figurecheck.py
        working-directory: .
        env:
          SS_REQUIRE_FIGURE_CHECK: "1"
