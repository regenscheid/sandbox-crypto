# SPDX-License-Identifier: MIT
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/generate_protos.py --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run python scripts/check_licenses.py

  # The workspace GUI (D80): packages from the lockfile, without install scripts.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24.20.0"
      # The lockfile's licenses and sources are checked before any package is installed,
      # and the installed packages' own licenses after.
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json
      - run: npm ci --ignore-scripts
      - run: python3 ../../scripts/check_licenses.py --npm package-lock.json --installed
      - run: npm run check
      - run: npm test
      - run: npm run build
